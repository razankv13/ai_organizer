name: ai_organizer
description: "AI-Powered Organizer App with Premium UI and Multi-language Support"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  
  # Localization & Internationalization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  easy_localization: ^3.0.7
  
  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  
  # Navigation
  go_router: ^15.1.2
  
  # Premium Theme & UI
  adaptive_theme: ^3.6.0
  dynamic_color: ^1.7.0
  flex_color_scheme: ^7.3.1
  google_fonts: ^6.2.1
  
  # Local Storage & Database
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  
  # Media & File Handling
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  file_picker: ^8.1.2
  camera: ^0.11.0+2
  
  # Backend Integration (Supabase)
  supabase_flutter: ^2.6.0
  
  # AI & Image Analysis
  google_generative_ai: ^0.2.2

  # Email Integration
  googleapis: ^13.2.0
  google_sign_in: ^6.2.1

  # Calendar
  table_calendar: ^3.1.2

  # Cloud Storage Integration
  dropbox_client: ^1.2.0
  flutter_secure_storage: ^9.2.2

  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # UI Components & Animations
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  
  # Utilities
  uuid: ^4.4.2
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  
  # Audio Recording & Playback
  record: ^6.0.0
  audioplayers: ^6.0.0
  permission_handler: ^11.3.0

  # Web Clipping & Link Preview
  any_link_preview: ^3.0.2
  html: ^0.15.4
  url_launcher: ^6.3.1

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.2

  # Sharing
  share_plus: ^10.1.2

  # Archive for backup/export
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.12
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  drift_dev: ^2.29.0
  flutter_gen_runner: ^5.12.0

flutter_gen:
  output: lib/core/gen/
  line_length: 80
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - .env
    - assets/translations/
    - assets/images/
    - assets/animations/
  

